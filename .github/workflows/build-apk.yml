name: Build APK

# Berjalan otomatis setiap kode diunggah ke branch main,
# atau secara manual lewat tab Actions → Build APK → Run workflow.
# Centang "rilis" hanya untuk APK rilis yang ditandatangani kunci developer.
# Butuh empat secret: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rilis:
        description: 'Bangun APK rilis yang ditandatangani (bukan debug)'
        type: boolean
        default: false

jobs:
  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rilis) }}
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Pasang SDK Android 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Bangun APK debug
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: Filemate-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  rilis:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rilis }}
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Pasang SDK Android 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan kunci penandatangan
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secret penandatangan belum lengkap. Isi ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, dan ANDROID_KEY_PASSWORD, lalu jalankan ulang."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/filemate-release.jks"

      - name: Bangun APK rilis
        env:
          FILEMATE_KEYSTORE_PATH: ${{ runner.temp }}/filemate-release.jks
          FILEMATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FILEMATE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FILEMATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Periksa tanda tangan APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Hapus salinan kunci
        if: always()
        run: rm -f "$RUNNER_TEMP/filemate-release.jks"

      - name: Simpan APK rilis untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: Filemate-release
          path: app/build/outputs/apk/release/app-release.apk
